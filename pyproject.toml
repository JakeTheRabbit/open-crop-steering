[project]
name = "open-crop-steering-backend"
version = "0.1.0"
description = "AI-supervised cannabis cultivation control plane (HA add-on backend)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
  { name = "JakeTheRabbit", email = "123831499+JakeTheRabbit@users.noreply.github.com" }
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "asyncpg>=0.30,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "httpx>=0.28,<1.0",
  "websockets>=13,<16",
  "influxdb-client>=1.46,<2.0",
  "python-telegram-bot>=21,<23",
  "python-dotenv>=1.0,<2.0",
  "aiofiles>=24,<25",
  "python-jose[cryptography]>=3.3,<4.0",
  "passlib[bcrypt]>=1.7,<2.0",
  "cryptography>=43,<46",
  "structlog>=24,<26",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.7,<1.0",
  "mypy>=1.13,<2.0",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=6,<7",
  "testcontainers[postgres]>=4.8,<5.0",
  "docker>=7,<8",
  "freezegun>=1.5,<2.0",
  "respx>=0.21,<1.0",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

# Ship the prompt markdown files inside the wheel. Without this,
# setuptools includes Python sources only and the prompts loader
# (app.prompts._PROMPTS_DIR) raises FileNotFoundError at runtime —
# silently in observe-only mode where the supervisor never reaches
# the LLM call, but loud as soon as the cultivation / playbook
# knowledge endpoints are hit.
[tool.setuptools.package-data]
"app.prompts" = ["*.md"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist", "node_modules", "alembic/versions"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "ARG", "PL", "RUF",
  "ASYNC", "DTZ", "ERA", "PIE", "PT", "RET", "TID", "TRY"
]
ignore = [
  "E501",   # line length handled by formatter
  "S101",   # assert in tests is fine
  "PLR0913", # function-arg count
  "TRY003", # long error messages allowed
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101", "S105", "S106", "PLR2004", "ARG", "PT012"]
"backend/alembic/**" = ["E402"]

[tool.ruff.format]
quote-style = "double"

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "telegram.*", "influxdb_client.*"]
ignore_missing_imports = true

# ---------- pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --cov=backend/app --cov-report=term-missing"
testpaths = ["backend/tests"]
asyncio_mode = "auto"
pythonpath = ["backend"]
markers = [
  "unit: unit tests (no external services)",
  "integration: integration tests (Postgres + InfluxDB via testcontainers)",
  "slow: tests that take >5s",
]

# ---------- coverage ----------
[tool.coverage.run]
source = ["backend/app"]
omit = ["backend/tests/*", "backend/alembic/*"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
