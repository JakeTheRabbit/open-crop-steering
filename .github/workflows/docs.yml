name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material mkdocs-mermaid2-plugin
      - name: Build (skipped if mkdocs.yml missing)
        run: |
          if [ ! -f mkdocs.yml ]; then
            echo "mkdocs.yml not present yet — Phase 13"
            exit 0
          fi
          mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: hashFiles('mkdocs.yml') != ''
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        if: hashFiles('mkdocs.yml') != ''
